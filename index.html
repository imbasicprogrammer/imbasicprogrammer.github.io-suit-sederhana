<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Suit Jawa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!--Area Computer-->
      <div class="row justify-content-center text-center pt-5 pb-5 area-computer">
        <div class="col-md-4 d-flex align-items-center justify-content-center"><img src="/img/paper.png" class="img-fluid img-computer" /></div>
      </div>
      
      <!--bar info-->
      <div class="row position-absolute top-50 start-50 translate-middle d-flex justify-content-center align-items-center text-center bar-info">
        <h2>VS</h2>
      </div>
      

      <!--Area Player-->
      <div class="row align-items-center mt-1 pt-5 pb-5 area-player">
        <div class="col-md-4 col-6 text-center P1">
          <img src="/img/scissors.png" class="img-fluid scissors" />
        </div>
        <div class="col-md-4 col-6 text-center P1">
          <img src="/img/paper.png" class="img-fluid paper" />
        </div>
        <div class="col-md-4 col-12 text-center P1">
          <img src="/img/rock.png" class="img-fluid rock" />
        </div>
      </div>
    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
